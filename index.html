<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
		<!-- include ar.js for a-frame -->
		<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
	</head>
	<body>
		<a-scene embedded arjs>
			<a-marker preset="hiro">

			<a-box color='red' height='1' width='1' depth='1' position='0 1 -15' rotation='0 45 0'></a-box>
			<a-cylinder color='green' position='0 1 -15' height='2' radius='0.5'></a-cylinder>
			<a-cone color='red' position='0 2 -15' height='1' radius='1'></a-cone>
				
			</a-marker>

			<!-- define a camera which will move according to the marker position -->
			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
