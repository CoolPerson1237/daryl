<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
		<!-- include ar.js for a-frame -->
		<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
	</head>
	<body>
		<a-scene embedded arjs>
			<a-marker type='pattern'  url="https://raw.githubusercontent.com/CoolPerson1237/daryl/ar/pattern-marker1.patt">

			<a-box color='red' height='2' width='2' depth='2' position='0 -0.5 2' rotation='0 0 45'></a-box>
			<a-cylinder color='green' position='0 -0.5 0' height='2' radius='0.5' rotation='90 0 0'></a-cylinder>
			<a-cone color='red' position='0 -0.5 -1' height='1' radius='1' rotation='-90 0 0'></a-cone>
				
			</a-marker>

			<!-- define a camera which will move according to the marker position -->
			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
