<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
		<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
	</head>
	<body>
		<a-scene embedded arjs>
			<a-marker type='pattern' url="https://raw.githubusercontent.com/CoolPerson1237/daryl/ar/pattern-paw.patt">
				
		<a-box color='red' height='2' width='0.2' depth='0.2' position='-2 -0.5 -1.5' rotation='0 0 90' animation='property: rotation; to: 360 0 90; from: 0 0 90; loop: true;'></a-box>
		<a-box color='red' height='2' width='0.2' depth='0.2' position='2 1.5 -1.5' rotation='0 0 90' animation='property: rotation; to: 360 0 90; from: 0 0 90; loop: true;'></a-box>
		<a-box color='red' height='1' width='0.2' depth='0.2' position='-2 -0.5 -1.5' rotation='90 0 0' animation='property: rotation; to: 90 360 0; from: 90 0 0; loop: true;'></a-box>
		<a-box color='red' height='1' width='0.2' depth='0.2' position='2 -0.5 -1.5' rotation='90 0 0' animation='property: rotation; to: 90 360 0; from: 90 0 0; loop: true;'></a-box>
				<a-text 
        value="Welcome to Loveland" 
        position="0 0.5 -1.5"         color="lightblue" 
        width="4" 
        align="center" 
        wrap-count="40"         rotation="-65 0 0"       ></a-text>
			</a-marker>

			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
