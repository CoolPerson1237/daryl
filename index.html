<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
		<!-- include ar.js for a-frame -->
		<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
	</head>
	<body>
		<a-scene embedded arjs>
			<a-marker preset="hiro">
				
			<a-box color='blue' height='2' width='2' depth='2' position='-2 5 -3' rotation='0 0 0'></a-box>
			<a-box color='lightblue' height='2' width='2' depth='2' position='2 5 -3' rotation='0 0 0'></a-box>
			<a-box color='red' height='2' width='2' depth='2' position='0 5 -3' rotation='0 0 0'></a-box>
  
			</a-marker>

			<!-- define a camera which will move according to the marker position -->
			<a-entity camera></a-entity>
		</a-scene>
	</body>
</html>
